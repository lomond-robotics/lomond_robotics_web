enable  : true
item  :
  - icon  : tf-ion-ios-lightbulb-outline
    title : AI-Harness Implementation
    description : >
      Purpose-built scaffolding around AI models for lab and engineering use:
      tool use, data interpretation, decision support, and evaluation,
      wired into your existing instruments and processes with the auditability
      and reliability a lab actually needs, not a chatbot bolted on top.

  - icon  : tf-ion-ios-flask-outline
    title : Laboratory Automation
    description : >
      Automation of chemistry and biochemistry workflows: liquid handling,
      sample processing, instrument control, and repetitive assay steps,
      sized to your throughput and budget, not a one-size-fits-all platform.

  - icon  : tf-ion-ios-settings
    title : Robotics Implementation
    description : >
      Robotic arms, end-effectors, motion control, and integration into lab
      or bench workflows, with custom sensors, actuators, controllers, and
      embedded systems built around your specific equipment and environment.

  - icon  : tf-ion-ios-cog
    title : Bespoke Lab Solutions
    description : >
      Full turnkey builds: measurement devices, engineering prototypes, and
      complete instrument supply, sourced, configured, integrated, and
      handed over as one working system from a single point of contact.

  - icon  : tf-ion-ios-pulse
    title : Data Processing & Analysis
    description : >
      Custom pipelines for capturing, cleaning, storing, and visualising
      measurement data from instruments, sensors, or lab equipment.

  - icon  : tf-ion-wrench
    title : Engineering Prototypes
    description : >
      One-off devices, proof-of-concept builds, measurement fixtures, and
      custom hardware for requirements that do not fit any off-the-shelf product.
